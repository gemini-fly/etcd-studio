version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      etcd-modules:
        patterns:
          - "go.etcd.io/etcd/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
